name: catalog
on:
  schedule:
    - cron: "30 8 * * *" # 14:30 Dhaka, after Gemini's free quota resets at midnight Pacific
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Read new product pages (shops without a product API)
        run: npm run catalog:pages
        env:
          PAGES_BUDGET: "700"
      - name: Fetch feeds and merge pages
        run: npm run catalog:fetch
      - name: Focused colour read for tagged pieces
        run: npm run catalog:colors || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          COLOR_BUDGET: "200"
      - name: Tag new pieces and rebuild catalog
        run: npm run catalog:tag
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAG_BUDGET: "250"
      - name: Commit
        run: |
          git config user.name "eos-bot"
          git config user.email "eos-bot@users.noreply.github.com"
          git add data/catalog public/catalog.json
          git diff --cached --quiet && exit 0
          git commit -m "catalog: weekly refresh"
          git pull --rebase --autostash
          git push
